<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wanderpose: travel photo planner</title>
  <meta name="theme-color" content="#f2f2f7" />
  <meta name="color-scheme" content="light only" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-plan" data-icon="list" title="My day" aria-label="Open my day"></button>
    <div class="brand">
      <button class="brand-title city-btn" id="btn-trips" title="Switch city or open your itinerary"><span id="city-name"></span><span class="chev" data-icon="down"></span></button>
      <div class="brand-sub" id="progress-text">Plan your spots and your shots</div>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
    <button class="pill-btn" id="btn-add" data-icon="plus" title="Search for places to add">Spot</button>
    <button class="icon-btn" id="btn-settings" data-icon="gear" title="Settings" aria-label="Settings"></button>
  </header>

  <main class="layout">
    <aside class="panel" id="panel" data-state="closed" aria-live="polite">
      <div class="panel-grip" id="panel-grip" aria-hidden="true"></div>
      <div class="panel-tools">
        <button class="nav-back" id="btn-back" data-icon="back" aria-label="Back to my day">Back</button>
        <span class="panel-heading" id="panel-heading"></span>
        <button class="circle-btn" id="btn-expand" data-icon="expand" aria-label="Expand panel" title="Expand"></button>
        <button class="circle-btn" id="btn-close" data-icon="xmark" aria-label="Close panel" title="Close"></button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </aside>
    <div id="map" class="map"></div>
    <button class="fab" id="btn-pin" data-icon="pin" title="Drop a pin anywhere on the map">Drop pin</button>
    <div class="add-hint" id="add-hint" hidden><span id="add-hint-text">Tap the map where your spot is</span><button id="btn-cancel-add">Cancel</button></div>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="circle-btn lb-close" id="lb-close" data-icon="xmark" aria-label="Close"></button>
    <div class="lb-main">
      <div class="lb-stage">
        <button class="circle-btn lb-nav lb-prev" id="lb-prev" data-icon="left" aria-label="Previous"></button>
        <img id="lb-img" alt="Pose inspiration" />
        <button class="circle-btn lb-nav lb-next" id="lb-next" data-icon="right" aria-label="Next"></button>
      </div>
      <aside class="lb-guide" id="lb-guide" hidden></aside>
    </div>
    <div class="lb-bar">
      <label class="check"><input type="checkbox" id="lb-done" /> I recreated this shot</label>
      <button class="btn primary" id="lb-ai">Where to stand &amp; how to pose</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <input type="file" id="file-input" accept="image/*" multiple hidden />

  <script src="icons.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="maps.js"></script>
  <script src="places.js"></script>
  <script src="ai.js"></script>
  <script src="transit.js"></script>
  <script src="sun.js"></script>
  <script src="app.js"></script>
</body>
</html>
